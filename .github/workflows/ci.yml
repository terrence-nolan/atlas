
name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ATLAS_GITHUB_USERNAME: ${{ vars.ATLAS_GITHUB_USERNAME }}
      ATLAS_GITHUB_CURRENT_REPOSITORY: ${{ vars.ATLAS_GITHUB_CURRENT_REPOSITORY }}
      ATLAS_GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          APP_ENV: ci
          DATA_MODE: mock

      - name: Build
        run: pnpm build
        env:
          APP_ENV: ci
          DATA_MODE: mock
